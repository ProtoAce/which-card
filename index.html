const $=id=>document.getElementById(id);
let pick=null, cat=null;
const norm=s=>s.toLowerCase().replace(/[’'.]/g,"");

function render(){
  const q=norm($("q").value.trim());
  const L=$("list");L.innerHTML="";
  if(q&&!pick){
    const hits=D.filter(m=>norm(m.a).includes(q)).slice(0,6);
    hits.forEach(m=>{
      const b=document.createElement("button");b.className="m";
      b.innerHTML=`<span>${m.n}</span><em>${CATS[m.c].n}</em>`;
      b.onclick=()=>{pick=m;cat=null;$("q").value=m.n;$("q").blur();render();reveal()};
      L.appendChild(b);
    });
    if(!hits.length)L.innerHTML=`<p class="none">No match. Pick a category below.</p>`;
  }
  const chips=$("chips");chips.innerHTML="";
  Object.keys(CATS).forEach(k=>{
    const b=document.createElement("button");b.textContent=CATS[k].n;
    b.setAttribute("aria-pressed",cat===k&&!pick);
    if(cat===k&&!pick)b.className="on";
    b.onclick=()=>{cat=k;pick=null;$("q").value="";render();reveal()};
    chips.appendChild(b);
  });
  result();
}
function reveal(){setTimeout(()=>$("out").scrollIntoView({behavior:"smooth",block:"nearest"}),60)}

function result(){
  const o=$("out");
  const c=pick?pick.c:cat;
  if(!c){o.innerHTML="";return}
  const fx=$("fx").checked, amt=parseFloat($("amt").value)||100;
  const noAmex=pick&&pick.x;
  const rate=fx?1:CATS[c].r;
  const useAmex=!noAmex&&rate*PT*100>WS;
  const pts=Math.floor(amt*rate);
  const wsCash=(amt*WS/100);
  let h;
  if(useAmex){
    h=`<section class="res"><h2>Scotia Amex Gold</h2>
    <div class="big">${pts.toLocaleString()} pts</div>
    <p class="mute">${rate}x on $${amt.toFixed(2)} ≈ $${(pts*PT).toFixed(2)} in travel value</p>
    <table class="cmp"><tr><td>Amex Gold</td><td>${rate}% back (${rate} pts/$)</td></tr><tr><td>Wealthsimple</td><td>2% = $${wsCash.toFixed(2)} cash</td></tr></table>`;
  }else{
    h=`<section class="res ws"><h2>Wealthsimple Visa</h2>
    <div class="big">$${wsCash.toFixed(2)} back</div>
    <p class="mute">2% on $${amt.toFixed(2)}</p>
    <table class="cmp"><tr><td>Amex Gold</td><td>${noAmex?"not accepted":rate+"% ("+rate+" pt/$)"}</td></tr><tr><td>Wealthsimple</td><td>2% cash</td></tr></table>`;
  }
  if(noAmex)h+=`<p class="warn">This merchant doesn't take Amex in Canada.</p>`;
  if(fx)h+=`<p class="mute">Foreign currency: Amex earns only 1x (no foreign transaction fee, though).</p>`;
  if(pick){if(pick.k)h+=`<p class="mute">Confirmed by cardholder reports.</p>`;else if(pick.q)h+=`<p class="warn">My guess from the merchant type. Check your first statement.</p>`;else h+=`<p class="mute">Likely, based on merchant type. Not confirmed.</p>`;if(pick.nt)h+=`<p class="warn">${pick.nt}</p>`}
  if(!$("amt").value)h+=`<p class="mute">Showing a $100 example. Enter an amount above.</p>`;
  h+=`<p class="mute">Valuing 1 point at 1¢.</p></section>`;
  o.innerHTML=h;
}

$("q").addEventListener("input",()=>{pick=null;if($("q").value)cat=null;render()});
$("amt").addEventListener("input",result);
$("fx").addEventListener("change",result);
render();
</script>
</body>
</html>
